name: CI

on:
  pull_request:
  push:
    branches: [develop, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # The offline suite runs on every change. The four jobs that each test one
  # part (the kb extra, the built wheel, the LaTeX engine, Docker) run on a
  # pull request only when it touches that part (.github/scripts/ci-jobs.sh,
  # tests/test_ci_jobs.py), and on every push to develop and main, so the
  # merged tree always gets all five.
  changes:
    name: Jobs this change needs
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      kb: ${{ steps.pick.outputs.kb }}
      wheel: ${{ steps.pick.outputs.wheel }}
      latex: ${{ steps.pick.outputs.latex }}
      docker: ${{ steps.pick.outputs.docker }}
    steps:
      # A pull request's diff needs the history back to where it left its
      # base. A string: a number 0 would read as false in the expression.
      - uses: actions/checkout@v4
        with:
          fetch-depth: ${{ github.event_name == 'pull_request' && '0' || '1' }}

      - name: Pick the jobs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        # pipefail: a script that fails fails this job (and so the run),
        # rather than leaving every part job skipped.
        run: |
          set -o pipefail
          if [ "$EVENT" = pull_request ]; then
            bash .github/scripts/ci-jobs.sh "$BASE" "$HEAD" | tee -a "$GITHUB_OUTPUT"
          else
            bash .github/scripts/ci-jobs.sh | tee -a "$GITHUB_OUTPUT"
          fi

  offline:
    name: Offline tests (no Docker)
    runs-on: ubuntu-latest
    # A hung test costs half an hour, not GitHub's six-hour default.
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (agenticcli)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: agenticcli

      - name: Install the langgraph and deepagents extras (backend tests)
        run: conda run -n agenticcli pip install -e '.[langgraph,deepagents]'

      # A test that hangs names itself: -v prints each test's id before it
      # runs, faulthandler_timeout dumps every thread's stack once a test has
      # run 120 s (a test stuck in an await shows only the event loop, so the
      # id is what names it), and --no-capture-output streams both as they
      # happen: conda run otherwise prints only when the command exits, which
      # a job stopped at its time limit never does.
      - name: Run offline test suite
        run: >
          conda run -n agenticcli --no-capture-output python -m pytest
          -m 'not llm and not docker' -v -o faulthandler_timeout=120

  kb-extra:
    name: Offline tests with the kb extra
    needs: changes
    if: needs.changes.outputs.kb == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (agenticcli)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: agenticcli

      - name: Cache pip downloads (torch is large)
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: pip-kb-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'environment.yml') }}

      # The CPU build of torch first: from PyPI, the kb extra would pull the
      # CUDA build, gigabytes the tests never use.
      - name: Install CPU-only torch
        run: >
          conda run -n agenticcli pip install torch
          --index-url https://download.pytorch.org/whl/cpu

      - name: Install the kb, langgraph and deepagents extras
        run: conda run -n agenticcli pip install -e '.[kb,langgraph,deepagents]'

      # The whole offline suite, so the real backends (sentence-transformers,
      # trafilatura) run where the other jobs use fakes.
      # KB_REQUIRE_EXTRA makes a missing kb library fail its tests rather
      # than skip them. The HF variables make loading an embedding model an
      # error: no offline test needs one, so none is downloaded or cached.
      # The output flags are the offline job's: a hang names its test.
      - name: Run offline test suite (fail if the kb extra is missing)
        env:
          KB_REQUIRE_EXTRA: "1"
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: >
          conda run -n agenticcli --no-capture-output python -m pytest
          -m 'not llm and not docker' -v -rs -o faulthandler_timeout=120

  wheel-acceptance:
    name: Built-wheel acceptance (console smoke, deepagents extra)
    needs: changes
    if: needs.changes.outputs.wheel == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (agenticcli)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: agenticcli

      # pexpect drives the console over a pty. Installed explicitly via the dev
      # extra rather than relied on transitively.
      - name: Install dev extra (pexpect)
        run: conda run -n agenticcli pip install -e '.[dev]'

      # Its own step rather than part of the offline suite: it builds a wheel
      # and installs that wheel's dependencies into a throwaway virtualenv, so
      # it is slow and needs the network. The opt-in env var is what the tests
      # gate on, so the offline selector stays fast and offline.
      #
      # Targets the files rather than `-m wheel` alone: a bare marker
      # selection still *collects* the whole suite, which would need the
      # backend extras installed only to collect tests this job does not run.
      # The second file installs the wheel with [deepagents] into its own
      # virtualenv and imports the backend there.
      - name: Run built-wheel acceptance
        env:
          AGENTIC_WHEEL_ACCEPTANCE: "1"
        run: >
          conda run -n agenticcli --no-capture-output python -m pytest
          tests/examples/test_research_demo_wheel.py
          tests/examples/test_deepagents_wheel.py -m wheel -v

  latex-engine:
    name: LaTeX engine tests
    needs: changes
    if: needs.changes.outputs.latex == 'true'
    runs-on: ubuntu-latest
    # Installing TeX Live from the apt mirrors has taken 22 minutes.
    timeout-minutes: 45
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      # compile_document's lockdown (no shell escape, paranoid file access) is
      # enforced by TeX itself, so it can only be verified against a real engine.
      - name: Install TeX Live (pdflatex + latexmk)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base texlive-latex-recommended latexmk

      - name: Set up conda env (agenticcli)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: agenticcli

      # Targets the file: a bare `-m latex` still collects the whole suite.
      - name: Run LaTeX engine tests (fail if the engine is missing)
        env:
          LATEX_REQUIRE: "1"
        run: >
          conda run -n agenticcli --no-capture-output python -m pytest
          tests/tools/test_document_compile_latex.py -m latex -v

  docker-isolation:
    name: Docker isolation tests
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash -el {0}
    steps:
      - uses: actions/checkout@v4

      - name: Set up conda env (agenticcli)
        uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          environment-file: environment.yml
          activate-environment: agenticcli

      - name: Install the backend extras (for clean full test collection)
        run: conda run -n agenticcli pip install -e '.[langgraph,deepagents]'

      # Keep this tag in sync with settings.sandbox_image's default. Pre-pulling
      # avoids first-run pull latency exceeding sandbox_start_timeout.
      - name: Pre-pull sandbox image
        run: docker pull quay.io/jupyter/scipy-notebook:python-3.12

      - name: Run docker isolation tests (fail if runtime missing)
        env:
          SANDBOX_REQUIRE_DOCKER: "1"
        run: conda run -n agenticcli --no-capture-output python -m pytest -m docker -v
