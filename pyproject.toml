[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "agentic-cli"
version = "0.6.4"
description = "A framework for building domain-specific agentic CLI applications"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [
    { name = "Andrey Shiryaev" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
]
dependencies = [
    "thinking-prompt>=0.3.0,<0.4",  # 0.4 renames and removes the UI API we use
    # 2.12: the version 0.7.0 was tested on. [mcp]: MCP servers
    # (AgentConfig.mcp_servers) on every install; ADK 2 made the SDK an extra.
    "google-adk[mcp]>=2.12,<3",
    # ADK's Claude path (google.adk.models.anthropic_llm) and our DirectAnthropicLlm
    # import `anthropic` at module load; google-adk only pulls it via optional extras,
    # so declare it directly (>=0.78 matches google-adk's own floor).
    "anthropic>=0.78",
    # ADK's OpenAI model classes (GPT, OpenRouter and endpoint models on ADK)
    # import `openai`; google-adk pulls it only via an extra. Its floor is ADK's.
    "openai>=2.20,<3",
    "google-genai>=2.30,<3",  # imported directly (google.genai.types); ADK 2.12 needs 2.30
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "PyYAML>=6.0",
    "structlog>=24.0.0",
    "rich>=13.0.0",
    "prompt-toolkit>=3.0.0",
    "httpx>=0.27.0",
    "numpy>=1.26.0,<2.0",
    "feedparser>=6.0.0",
    "pypdf>=4.0.0",
    "html2text>=2020.1.16",  # eager import in tools/webfetch/converter.py
    "jupyter_client>=8.0.0",
    "ipykernel>=6.0.0",
    # Durable sessions (on by default): ADK's DatabaseSessionService runs on
    # SQLAlchemy's async engine, with an async SQLite driver and greenlet.
    # ADK 2 moved SQLAlchemy to its `db` extra, which also brings Spanner,
    # gRPC and Alembic that nothing here uses, so it is declared directly.
    "sqlalchemy[asyncio]>=2,<3",
    "aiosqlite>=0.20.0",
    "greenlet>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    # The console smoke tests drive the real prompt_toolkit application over a
    # pty; it is available transitively today (via ipykernel), which is not a
    # guarantee, so declare it.
    "pexpect>=4.9.0",
]
kb = [
    "torch>=2.2.0",
    "sentence-transformers>=2.0.0,<3.0.0",
    "faiss-cpu>=1.7.0",
    "bm25s>=0.2.0",
    "rank-bm25>=0.2.2",
    # Keeps a web page's main text for ingestion (memory/kb/convert.py);
    # without it, ingestion falls back to html2text.
    "trafilatura>=2.0",
]
langgraph = [
    "langgraph>=0.2.0",
    # Deep Agents' floors. The LangChain model adapter
    # (workflow/langchain_models.py) needs ChatAnthropic's reasoning_effort and
    # summarized adaptive thinking, Gemini's reasoning_effort, the model
    # profile's effort fields and ChatOpenRouter. Through openrouter, this
    # extra keeps pydantic below 2.13.
    "langchain>=1.4.6",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langchain-openrouter>=0.2",
    # Persistent checkpointer backends (sqlite/postgres store_type). The async
    # savers are required because the manager streams via astream_events.
    "langgraph-checkpoint-sqlite>=2.0",
    "langgraph-checkpoint-postgres>=2.0",
]
deepagents = [
    # The Deep Agents backend (orchestrator = "deepagents"). Deep Agents is
    # beta and releases about twice a week, so it is held below the next minor
    # and upgraded in deliberate changes.
    "deepagents>=0.7.28,<0.8",
    # The LangChain model adapter's floors, as in the langgraph extra.
    "langchain>=1.4.6",
    "langchain-core>=1.6.11",
    "langchain-openai>=1.7",
    "langchain-anthropic>=1.7.6",
    "langchain-google-genai>=4.4.2",
    "langchain-openrouter>=0.2",
    # Sessions: the async savers behind session_store (sqlite, postgres).
    "langgraph-checkpoint-sqlite>=3.1",
    "langgraph-checkpoint-postgres>=3.1",
    # MCP servers (AgentConfig.mcp_servers) as LangChain tools.
    "langchain-mcp-adapters>=0.3",
]

[project.scripts]
research-demo = "research_demo.__main__:main"

[project.urls]
Homepage = "https://github.com/shoom1/agentic-cli"
Repository = "https://github.com/shoom1/agentic-cli"

[tool.hatch.build.targets.wheel]
packages = ["src/agentic_cli", "examples/research_demo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "llm: tests that require real LLM API calls (deselect with -m 'not llm')",
    "docker: tests that require a real container runtime (select with -m docker; set SANDBOX_REQUIRE_DOCKER=1 to fail instead of skip when absent)",
    "latex: tests that require a host TeX engine (select with -m latex; set LATEX_REQUIRE=1 to fail instead of skip when absent)",
    "wheel: acceptance tests that build and install the wheel (select with -m wheel; excluded from the offline suite because they download dependencies)",
]

[tool.ruff]
line-length = 88
target-version = "py312"
